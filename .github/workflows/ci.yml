name: RJE System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sales-system/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sales-system/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Backend Syntax
        run: find . -type f -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sales-system/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sales-system/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
