<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f2a" />
    <meta name="description" content="RJE Motorparts and Accessories sales management system" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/rje-logo.png" />
    <script>
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("rje-appearance") || "system"; } catch {}
        const theme = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0B1220" : "#F5F7FB";
      })();
    </script>
    <style>html{background:#F5F7FB;color:#0F172A}html[data-theme="dark"]{background:#0B1220;color:#F1F5F9}</style>
    <title>RJE Sales Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
